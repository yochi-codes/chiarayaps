<!DOCTYPE html>
<html>
<head>
    <title>Eat The Tomato</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
</head>
<body>
    <a href = "index.html" style = "font-size: 20px"><h6>Home</h6></a>
    <script>
        function setup() {
          createCanvas(400, 400);
          background(255);
          noStroke();
          fill(255, 68, 0);
          text("Eat the tomato.", 10, 20);
          ellipse(200, 200, 200, 200);
          fill(15, 199, 12);
          triangle(200, 100, 175, 75, 150, 90);
          triangle(200, 100, 225, 75, 250, 90);
        }

        function draw() {
          fill(255, 255, 255);
          noStroke();
          ellipse(mouseX, mouseY, 30, 30);
        }
    </script>
</body>
</html>
